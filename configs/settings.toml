# 美股交易 Agent 配置文件

# 全局设置
[general]
default_timeframe = "1d"
default_time_range = 7
default_risk_level = "medium"
max_position_pct = 20
max_sector_pct = 40
min_cash_ratio = 10
max_single_risk_pct = 2

# Futu OpenD 连接
[futu]
host = "127.0.0.1"
port = 11111
env = "SIMULATE"

# 技术面分析偏好
[technical]
default_indicators = ["MA", "MACD", "RSI", "KDJ", "BOLL", "ATR", "OBV"]
vcp_min_contraction = 3
td_sequence_enabled = true
multi_timeframe_resonance = true

# 资金管理
[portfolio]
total_capital_default = 100000
max_single_position_pct = 20
max_sector_concentration_pct = 40
min_cash_reserve_pct = 10
max_daily_trades = 5
max_open_positions = 10

# 风控参数
[risk]
atr_stop_multiplier = 2.0
fixed_stop_pct = 5
trailing_stop_trigger_pct = 5
trailing_stop_pct = 5
daily_loss_limit_pct = 3
weekly_loss_limit_pct = 5

# 扫描条件
[scan]
min_market_cap_billion = 10
price_above_ma200 = true
rsi_max_oversold_large_cap = 25
rsi_max_oversold_small_cap = 30
distance_from_52w_high_min_pct = 8
min_gross_margin_pct = 20
min_net_margin_pct = 5
min_revenue_growth_pct = -10

# 情绪阈值
[sentiment]
vix_very_low = 15
vix_low = 20
vix_medium = 30
vix_high = 40
bullish_threshold = 70
bearish_threshold = 30
